<html lang="en">
  
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6F4EE" />

      name="description"
      content="We unite three generations of stakeholders from Nepal and

    <!-- <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> -->
   
    <!-- Browsers keep a favicon for a long time. Give a changed icon a new file name so they fetch it again. -->

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/nf-logo.png">
    <title>Nutrition Fellowship</title>
    <!-- The preview card that chat apps and social sites show for a shared link. The image URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nutrition Fellowship" />
    <meta property="og:title" content="Nutrition Fellowship" />
    <meta property="og:description" content="Three generations united for nutrition: students and professionals in Nepal and South Asia." />
    <meta property="og:image" content="https://nutfellowship.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nutrition Fellowship logo and a health worker giving vitamin A drops to a child." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nutrition Fellowship" />
    <meta name="twitter:description" content="Three generations united for nutrition: students and professionals in Nepal and South Asia." />
    <meta name="twitter:image" content="https://nutfellowship.com/og-image.jpg" />
